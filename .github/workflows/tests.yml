name: Tests

# Lua tests of the Hof Bergmann delivery and semen code, run against engine stubs (tests/stubs.lua).
on:
    pull_request:
    push:
        branches: [main]

jobs:
    lua:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'
            - run: pip install lupa
            - run: python tests/run.py
